- type: entity
  abstract: true
  parent: STClothingHeadBase # Can replace with our own parent later to disconnect from RU prototypes.
  id: STOWClothingHeadHelmetPVPT3Base
  name: PVP helmet base T3
  suffix: STOW, T3, PVP
  components:
  - type: Craftable
  - type: STWeight
    self: 2.1 
  - type: Armor # Blunt -20%, Slash -15%, Pierce -25%
    armorClass: 3
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.85
        Piercing: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.95 # Removed Reflect, added 5% Pierce resist.
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop

