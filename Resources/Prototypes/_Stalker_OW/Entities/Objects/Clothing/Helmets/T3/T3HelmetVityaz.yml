- type: entity
  abstract: true
  parent: STClothingHeadBase # Can replace with our own parent later to disconnect from RU prototypes.
  id: STOWClothingHeadHelmetVityazT3Base
  name: Vityaz Tactical Helmet
  suffix: STOW, T3, Tactical
  components:
  - type: Craftable
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
      - BlockMask
  - type: STWeight
    self: 4
  - type: Armor
    armorClass: 3
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: Reflect
    reflectProb: 0.01
    spread: 360
    reflects:
      - NonEnergy
    soundOnReflect: /Audio/_Stalker/Effects/sear.ogg
  - type: HelmetVisor
    toggleAction: ActionToggleHelmetVisor
    equippedPrefixUp: visor-up
    iconStateUp: icon-visor-up
    visorUpReflectProb: 0.01
    visorUpModifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.90
    isToggleable: true
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - Snout
  - type: SlotBlockOverride
    tag: BlockMask

- type: entity
  parent: STOWClothingHeadHelmetVityazT3Base
  id: STOWClothingHeadHelmetVityaz1C
  name: helmet Vityaz 1S
  description: The Vityaz-S shockproof helmet was made at the Steel Research Institute. Development on the helmet started in the late 1980s. The helmet got a visor, even though it ended up being pretty bulky.
